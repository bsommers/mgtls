worker_processes auto;
pid /tmp/mgtls-nginx.pid;
error_log /tmp/mgtls-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    default_type application/json;
    access_log /tmp/mgtls-nginx-access.log;

    upstream backend_service {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost gateway.internal;

        # Server Certificate Chain (Leaf + Intermediate CA) & Private Key
        ssl_certificate     .mgtls-nginx/certs/nginx-srv/fullchain.pem;
        ssl_certificate_key .mgtls-nginx/certs/nginx-srv/key.pem;

        # Client Certificate Verification (Intermediate + Root CA Bundle)
        ssl_client_certificate .mgtls-nginx/certs/nginx-srv/ca-chain.pem;
        ssl_verify_client      on;
        ssl_verify_depth       3;

        # Modern TLS 1.2 / 1.3 Cipher & Protocol Hardening
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Built-in mTLS Identity Diagnostic Endpoint
        location = /mtls-status {
            return 200 '{"authenticated":true,"verify":"$ssl_client_verify","subject_dn":"$ssl_client_s_dn","issuer_dn":"$ssl_client_i_dn","serial":"$ssl_client_serial","fingerprint":"$ssl_client_fingerprint","protocol":"$ssl_protocol","cipher":"$ssl_cipher"}\n';
        }

        # Reverse Proxy Forwarding Verified Client Certificate Headers
        location / {
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"error":"mTLS client certificate verification failed"}\n';
            }

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Propagate verified X.509 client identity to upstream microservices
            proxy_set_header X-SSL-Client-Verify      $ssl_client_verify;
            proxy_set_header X-SSL-Client-S-DN        $ssl_client_s_dn;
            proxy_set_header X-SSL-Client-I-DN        $ssl_client_i_dn;
            proxy_set_header X-SSL-Client-Serial      $ssl_client_serial;
            proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
            proxy_set_header X-SSL-Client-Cert        $ssl_client_escaped_cert;
        }
    }
}
