<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mgtls icon">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#071a1e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#iconBg)" stroke="url(#iconGrad)" stroke-width="8"/>

  <!-- Subtle Glow -->
  <circle cx="256" cy="240" r="180" fill="#10b981" fill-opacity="0.09"/>

  <!-- Circuit Nodes -->
  <line x1="56" y1="156" x2="112" y2="156" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="48" cy="156" r="10" fill="#06b6d4"/>
  <line x1="400" y1="156" x2="456" y2="156" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="464" cy="156" r="10" fill="#10b981"/>

  <line x1="48" y1="320" x2="120" y2="320" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="320" r="10" fill="#10b981"/>
  <line x1="392" y1="320" x2="464" y2="320" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="472" cy="320" r="10" fill="#06b6d4"/>

  <!-- Main Cryptographic Shield -->
  <path d="M256 56 L416 118 V256 C416 362 344 430 256 462 C168 430 96 362 96 256 V118 L256 56 Z"
        fill="url(#shieldFill)" stroke="url(#iconGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Inner Dashed Contour -->
  <path d="M256 88 L386 138 V252 C386 338 326 396 256 424 C186 396 126 338 126 252 V138 L256 88 Z"
        fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="12,10" stroke-opacity="0.7"/>

  <!-- Lock Shackle -->
  <path d="M210 212 V170 C210 144 230 124 256 124 C282 124 302 144 302 170 V212"
        fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="176" y="212" width="160" height="132" rx="22" fill="#0f172a" stroke="url(#iconGrad)" stroke-width="7"/>

  <!-- Bidirectional mTLS Handshake Arrows -->
  <path d="M206 258 H296" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
  <path d="M282 242 L302 258 L282 274" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M306 300 H216" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
  <path d="M230 284 L210 300 L230 316" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Root CA Key Node -->
  <circle cx="256" cy="384" r="14" fill="#10b981" stroke="#070b14" stroke-width="5"/>
</svg>
