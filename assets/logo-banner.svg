<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" role="img" aria-label="mgtls — Unified TLS, mTLS, Local/Public CA, OpenSSH CA &amp; Target Provisioning Engine">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#071a1e"/>
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Outer Card Background -->
  <rect x="4" y="4" width="912" height="252" rx="22" fill="url(#bgGrad)" stroke="url(#emeraldCyan)" stroke-width="2"/>
  <rect x="4" y="4" width="912" height="252" rx="22" fill="url(#cyberGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="145" cy="130" r="88" fill="#10b981" fill-opacity="0.10"/>
  <circle cx="780" cy="70" r="95" fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Left Emblem: Cryptographic Shield + Lock + mTLS Handshake Arrows + Key Nodes -->
  <g transform="translate(52, 32)">
    <!-- Outer Hexagonal/Shield Circuit Nodes -->
    <line x1="15" y1="48" x2="40" y2="48" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="12" cy="48" r="4.5" fill="#06b6d4"/>
    <line x1="155" y1="48" x2="180" y2="48" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="183" cy="48" r="4.5" fill="#10b981"/>

    <line x1="10" y1="132" x2="44" y2="132" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="7" cy="132" r="4.5" fill="#10b981"/>
    <line x1="151" y1="132" x2="185" y2="132" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="188" cy="132" r="4.5" fill="#06b6d4"/>

    <!-- Main Shield Path -->
    <path d="M97.5 8 L168 36 V98 C168 145 136 177 97.5 192 C59 177 27 145 27 98 V36 L97.5 8 Z"
          fill="url(#shieldFill)" stroke="url(#emeraldCyan)" stroke-width="3.5" filter="url(#neonGlow)"/>

    <!-- Inner Shield Contour -->
    <path d="M97.5 22 L154 45 V96 C154 135 128 162 97.5 176 C67 162 41 135 41 96 V45 L97.5 22 Z"
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,4" stroke-opacity="0.65"/>

    <!-- Lock Shackle -->
    <path d="M77 78 V60 C77 48.5 86 40 97.5 40 C109 40 118 48.5 118 60 V78"
          fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

    <!-- Lock Body -->
    <rect x="63" y="78" width="69" height="58" rx="10" fill="#0f172a" stroke="url(#emeraldCyan)" stroke-width="2.8"/>

    <!-- Bidirectional mTLS Handshake Arrows Inside Lock -->
    <!-- Top Arrow (Client -> Server) -->
    <path d="M76 98 H115" stroke="#10b981" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M109 92 L117 98 L109 104" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Arrow (Server -> Client) -->
    <path d="M119 116 H80" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M86 110 L78 116 L86 122" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Key Root CA Node -->
    <circle cx="97.5" cy="154" r="6" fill="#10b981" stroke="#070b14" stroke-width="2"/>
  </g>

  <!-- Wordmark & Typography -->
  <g transform="translate(278, 0)">
    <!-- Top Status Pill -->
    <rect x="0" y="38" width="388" height="26" rx="13" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="51" r="4.5" fill="#10b981"/>
    <text x="29" y="55.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399" letter-spacing="1.2">ZERO-CGO GO 1.26 · CLI + MCP JSON-RPC 2.0 SERVER</text>

    <!-- Main Brand Title -->
    <text x="0" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#textGrad)" letter-spacing="-2">mgtls</text>
    <text x="230" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" fill="#10b981">v1.0.0</text>

    <!-- Subtitle -->
    <text x="2" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="600" fill="#94a3b8">
      Unified X.509 PKI, Mutual TLS, OpenSSH CA, Free ACME v2 &amp; Target Provisioning Engine
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(2, 190)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="108" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="12" y="18.5" fill="#34d399">◈ X.509 mTLS</text>

      <rect x="118" y="0" width="114" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="130" y="18.5" fill="#38bdf8">◈ OpenSSH CA</text>

      <rect x="242" y="0" width="104" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="254" y="18.5" fill="#a78bfa">◈ ACME v2</text>

      <rect x="356" y="0" width="114" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="368" y="18.5" fill="#fbbf24">◈ 7 Targets</text>

      <rect x="480" y="0" width="122" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="492" y="18.5" fill="#f472b6">◈ 18 MCP Tools</text>
    </g>
  </g>
</svg>
